<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>KNOX</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KNOX">
<meta name="theme-color" content="#07080b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #07080b;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  body {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 48%, #0d1117 0%, #07080b 62%);
    cursor: pointer;
  }
  .stage {
    position: relative;
    width: min(62vw, 42vh); height: min(62vw, 42vh);
    transform: scale(0.94);
    will-change: transform;
  }
  .glow {
    position: absolute; inset: -38%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(140,175,230,0.22) 0%, rgba(110,145,210,0.08) 42%, rgba(0,0,0,0) 70%);
    opacity: 0.65;
    pointer-events: none;
  }
  .blob {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 40% 35%, #f2f5fb 0%, #c9d4e6 38%, #8fa3c4 78%, #7389ae 100%);
    box-shadow: 0 0 60px rgba(150,180,235,0.35), inset -12px -18px 40px rgba(60,80,120,0.35);
    border-radius: 50%;
    filter: blur(1px);
  }
  .word {
    position: absolute; left: 0; right: 0;
    bottom: calc(18vh + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font: 300 11px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    letter-spacing: 0.35em; text-transform: lowercase;
    color: rgba(220,228,240,0.28);
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage" aria-label="KNOX">
    <div class="glow"></div>
    <div class="blob"></div>
  </div>
  <div class="word" aria-live="polite"></div>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var DEMO = params.get("demo") === "1";
  var CAPTURE = params.get("capture") === "1";
  var reduceMotion = false;
  try { reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var TIME_SCALE = reduceMotion ? 0.47 : 1;

  var stage = document.querySelector(".stage");
  var glow = document.querySelector(".glow");
  var blob = document.querySelector(".blob");
  var word = document.querySelector(".word");

  var ORDER = ["idle", "listening", "thinking", "talking"];
  // Palettes: 4 blob gradient stops, glow color, outer shadow color, inset shade, glow strength
  var PAL = {
    idle:      { s: [[242,245,251],[201,212,230],[143,163,196],[115,137,174]], g: [140,175,230], g2: [110,145,210], sh: [150,180,235], in: [60,80,120],  k: 1.00 },
    listening: { s: [[234,243,255],[168,201,246],[ 94,144,222],[ 60,106,192]], g: [ 88,152,246], g2: [ 70,125,225], sh: [100,160,250], in: [30,60,130],  k: 1.40 },
    thinking:  { s: [[238,233,255],[186,172,241],[122,103,207],[ 86, 69,172]], g: [138,108,238], g2: [ 96, 82,210], sh: [150,120,245], in: [50,35,110],  k: 1.30 },
    talking:   { s: [[255,251,242],[246,231,198],[219,192,138],[186,154,100]], g: [246,212,150], g2: [222,180,120], sh: [250,220,165], in: [120,90,50],  k: 1.30 }
  };
  // v1 wobble keyframes (border-radius 8 values), 17s loop
  var WOB = [
    [50,50,50,50,50,50,50,50],
    [53,47,51,49,48,53,47,52],
    [48,52,47,53,52,47,53,48],
    [51,49,53,47,49,51,49,51]
  ];

  var state = "idle";
  var autoListen = false;
  var w = { idle: 1, listening: 0, thinking: 0, talking: 0 };
  var t = 0;              // seconds of animation time
  var wobPhase = 0;       // accumulated wobble phase (seconds of 17s loop)
  var lvl = 0;            // smoothed mic level 0..1
  var loudFor = 0, quietFor = 0;

  // ---------- microphone (optional, only requested on tap) ----------
  var mic = { requested: false, active: false, ctx: null, an: null, buf: null, stream: null };

  function micUsable() {
    return mic.active && mic.ctx && mic.ctx.state === "running" && mic.an;
  }
  function requestMic() {
    if (mic.requested) { resumeAudio(); return; }
    mic.requested = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      mic.ctx = new AC();              // created inside the tap so iOS allows it
      mic.ctx.onstatechange = function () { if (mic.ctx.state !== "running") lvl = 0; };
      var p = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
      p.then(function (stream) {
        try {
          mic.stream = stream;
          var src = mic.ctx.createMediaStreamSource(stream);
          mic.an = mic.ctx.createAnalyser();
          mic.an.fftSize = 1024;
          mic.an.smoothingTimeConstant = 0.3;
          mic.buf = new Uint8Array(mic.an.fftSize);
          src.connect(mic.an);       // analyser only; nothing goes to speakers
          stream.getAudioTracks().forEach(function (tr) {
            tr.onended = function () { mic.active = false; lvl = 0; };
            tr.onmute = function () { lvl = 0; };
          });
          mic.active = true;
          resumeAudio();
        } catch (e) { mic.active = false; }
      }).catch(function () { mic.active = false; });
    } catch (e) { mic.active = false; }
  }
  function resumeAudio() {
    try { if (mic.ctx && mic.ctx.state !== "running" && mic.ctx.state !== "closed") mic.ctx.resume().catch(function () {}); } catch (e) {}
  }
  function readMic() {
    if (!micUsable()) return 0;
    try {
      mic.an.getByteTimeDomainData(mic.buf);
      var sum = 0;
      for (var i = 0; i < mic.buf.length; i++) { var v = (mic.buf[i] - 128) / 128; sum += v * v; }
      var rms = Math.sqrt(sum / mic.buf.length);
      return Math.max(0, Math.min(1, (rms - 0.012) / 0.11));
    } catch (e) { return 0; }
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) resumeAudio(); });

  // ---------- state control ----------
  var wordAt = -10;        // animation time when the state word was shown
  function showWord(s) { word.textContent = s; wordAt = t; }
  function setState(s, opts) {
    opts = opts || {};
    state = s;
    autoListen = !!opts.auto;
    loudFor = 0; quietFor = 0;
    if (opts.word) showWord(s);
  }
  function onTap() {
    if (DEMO) return;
    var next = ORDER[(ORDER.indexOf(state) + 1) % ORDER.length];
    if (next === "listening") requestMic(); else resumeAudio();
    setState(next, { word: true });
  }
  document.addEventListener("click", onTap);

  // ---------- helpers ----------
  function lerp(a, b, x) { return a + (b - a) * x; }
  function smooth(x) { return x * x * (3 - 2 * x); }
  function mix(key, idx) {         // weighted blend of a palette color
    var r = 0, g = 0, b = 0, tot = 0;
    for (var i = 0; i < 4; i++) {
      var s = ORDER[i], ww = w[s]; if (ww <= 0.0001) continue;
      var c = idx === undefined ? PAL[s][key] : PAL[s][key][idx];
      r += c[0] * ww; g += c[1] * ww; b += c[2] * ww; tot += ww;
    }
    return [r / tot, g / tot, b / tot];
  }
  function rgb(c) { return Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]); }
  function hex(c) { return "rgb(" + rgb(c) + ")"; }
  var TAU = Math.PI * 2;

  // speech-like envelope 0..1
  function speech(tt) {
    var syl = Math.max(0, Math.sin(TAU * 3.1 * tt + 1.4 * Math.sin(TAU * 0.83 * tt)));
    syl = Math.pow(syl, 1.4);
    var phrase = smooth(Math.max(0, Math.min(1, (Math.sin(TAU * tt / 2.7) + 0.35) / 0.6)));
    var accent = 0.6 + 0.4 * Math.sin(TAU * 0.41 * tt + 1.1);
    return syl * phrase * accent;
  }

  // ---------- frame ----------
  function frame(dt) {
    dt = Math.min(dt, 0.1);
    t += dt * TIME_SCALE;

    if (DEMO) {
      var di = Math.floor(t / 3) % 4;
      if (ORDER[di] !== state) setState(ORDER[di], { word: true });
    }

    // mic level + optional auto-listen
    var raw = readMic();
    lvl += (raw - lvl) * (1 - Math.exp(-dt / (raw > lvl ? 0.05 : 0.18)));
    if (!DEMO && micUsable()) {
      if (state === "idle") {
        loudFor = lvl > 0.2 ? loudFor + dt : 0;
        if (loudFor > 0.12) setState("listening", { auto: true });
      } else if (state === "listening" && autoListen) {
        quietFor = lvl < 0.08 ? quietFor + dt : 0;
        if (quietFor > 1.5) setState("idle");
      }
    }

    // ease state weights (~0.8s to settle)
    var a = 1 - Math.exp(-dt / 0.27);
    for (var i = 0; i < 4; i++) { var s = ORDER[i]; w[s] += ((s === state ? 1 : 0) - w[s]) * a; }

    var hasMic = micUsable();
    // per-state scale + glow
    var sp = speech(t);
    var S = {
      idle:      0.99 - 0.05 * Math.cos(TAU * t / 5.6),
      listening: hasMic ? 0.985 + 0.015 * Math.sin(TAU * t / 3) + 0.13 * lvl
                        : 1.0 - 0.035 * Math.cos(TAU * t / 2.2),
      thinking:  0.98 + 0.015 * Math.sin(TAU * t / 4.2),
      talking:   0.975 + 0.065 * sp
    };
    var G = {
      idle:      0.825 - 0.175 * Math.cos(TAU * t / 5.6),
      listening: hasMic ? 0.7 + 0.3 * lvl : 0.8 - 0.2 * Math.cos(TAU * t / 2.2),
      thinking:  0.78 + 0.12 * Math.sin(TAU * t / 1.9) + 0.08 * Math.sin(TAU * t / 3.3 + 1),
      talking:   0.72 + 0.28 * sp
    };
    var scale = 0, gop = 0, wobAmp = 0, wobSpeed = 0, hx = 0, hy = 0, gx = 0, gy = 0, k = 0;
    var ang = TAU * t / 7;     // slow rotation used by thinking
    for (i = 0; i < 4; i++) {
      s = ORDER[i]; var ww = w[s];
      scale += S[s] * ww; gop += G[s] * ww; k += PAL[s].k * ww;
      var th = s === "thinking";
      wobAmp += (th ? 2.3 : 1) * ww;
      wobSpeed += (th ? 3.2 : 1) * ww;
      hx += (th ? 50 + 14 * Math.cos(ang) : 40) * ww;
      hy += (th ? 50 + 14 * Math.sin(ang) : 35) * ww;
      gx += (th ? 50 - 5 * Math.cos(ang) : 50) * ww;
      gy += (th ? 50 - 5 * Math.sin(ang) : 50) * ww;
    }
    var tot = w.idle + w.listening + w.thinking + w.talking;
    scale /= tot; gop /= tot; k /= tot; wobAmp /= tot; wobSpeed /= tot;
    hx /= tot; hy /= tot; gx /= tot; gy /= tot;

    // organic wobble (v1 keyframes, amplitude/speed blended)
    wobPhase += dt * TIME_SCALE * wobSpeed;
    var p = (wobPhase % 17) / 17 * 4, ki = Math.floor(p) % 4, kf = smooth(p - Math.floor(p));
    var A = WOB[ki], B = WOB[(ki + 1) % 4], br = [];
    for (i = 0; i < 8; i++) br.push((50 + (lerp(A[i], B[i], kf) - 50) * wobAmp).toFixed(2) + "%");

    var s0 = mix("s", 0), s1 = mix("s", 1), s2 = mix("s", 2), s3 = mix("s", 3);
    var gc = mix("g"), gc2 = mix("g2"), sh = mix("sh"), sin_ = mix("in");

    stage.style.transform = "scale(" + scale.toFixed(4) + ")";
    blob.style.borderRadius = br.slice(0, 4).join(" ") + " / " + br.slice(4).join(" ");
    blob.style.background = "radial-gradient(circle at " + hx.toFixed(1) + "% " + hy.toFixed(1) + "%, " +
      hex(s0) + " 0%, " + hex(s1) + " 38%, " + hex(s2) + " 78%, " + hex(s3) + " 100%)";
    blob.style.boxShadow = "0 0 " + Math.round(60 * k) + "px rgba(" + rgb(sh) + "," + (0.35 * k).toFixed(3) + "), inset -12px -18px 40px rgba(" + rgb(sin_) + ",0.35)";
    glow.style.transform = "translate(" + (gx - 50).toFixed(2) + "%," + (gy - 50).toFixed(2) + "%)";
    glow.style.background = "radial-gradient(circle, rgba(" + rgb(gc) + "," + (0.22 * k).toFixed(3) + ") 0%, rgba(" +
      rgb(gc2) + "," + (0.08 * k).toFixed(3) + ") 42%, rgba(0,0,0,0) 70%)";
    glow.style.opacity = Math.max(0, Math.min(1, gop)).toFixed(3);
    // faint state word: fade in 0.25s, hold, fade out by ~1.3s
    var wa = (t - wordAt) / TIME_SCALE;
    var wo = wa < 0 || wa > 1.3 ? 0 : Math.min(1, wa / 0.25, (1.3 - wa) / 0.35);
    word.style.opacity = wo.toFixed(3);
  }

  if (CAPTURE) {
    // deterministic stepping for headless capture
    window.knoxStep = function (ms) { frame(ms / 1000); };
    window.knoxSet = function (s) { setState(s); };
    frame(0);
  } else {
    var last = null;
    var loop = function (now) {
      var dt = last === null ? 0 : (now - last) / 1000;
      last = now;
      try { frame(dt); } catch (e) {}
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
